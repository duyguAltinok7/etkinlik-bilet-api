services:
  api:
    build: .
    container_name: event-api
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      LOG_DB_URL: ${LOG_DB_URL}
    depends_on:
      - postgres
      - redis

  redis:
    image: redis:7
    container_name: event-redis
    ports:
      - "6379:6379"

  postgres:
    image: postgres:17
    container_name: event-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-log-db.sh:/docker-entrypoint-initdb.d/init-log-db.sh

volumes:
  pgdata:
